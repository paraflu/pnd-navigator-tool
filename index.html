<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PND Navigator Patcher</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 600px;
            width: 100%;
            padding: 40px;
        }
        h1 {
            color: #2d3748;
            font-size: 28px;
            margin-bottom: 10px;
            text-align: center;
        }
        .subtitle {
            color: #718096;
            text-align: center;
            margin-bottom: 30px;
            font-size: 14px;
        }
        .drop-zone {
            border: 3px dashed #cbd5e0;
            border-radius: 12px;
            padding: 60px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            background: #f7fafc;
        }
        .drop-zone:hover {
            border-color: #667eea;
            background: #edf2f7;
        }
        .drop-zone.dragover {
            border-color: #667eea;
            background: #e6fffa;
            transform: scale(1.02);
        }
        .drop-zone-icon {
            font-size: 48px;
            margin-bottom: 16px;
        }
        .drop-zone-text {
            color: #4a5568;
            font-size: 16px;
            margin-bottom: 8px;
        }
        .drop-zone-hint {
            color: #a0aec0;
            font-size: 13px;
        }
        input[type="file"] {
            display: none;
        }
        .progress {
            margin-top: 30px;
            display: none;
        }
        .progress-bar {
            width: 100%;
            height: 8px;
            background: #e2e8f0;
            border-radius: 4px;
            overflow: hidden;
        }
        .progress-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            width: 0%;
            transition: width 0.3s ease;
        }
        .progress-text {
            margin-top: 12px;
            color: #4a5568;
            font-size: 14px;
            text-align: center;
        }
        .result {
            margin-top: 30px;
            padding: 20px;
            border-radius: 12px;
            display: none;
        }
        .result.success {
            background: #c6f6d5;
            border: 2px solid #48bb78;
        }
        .result.error {
            background: #fed7d7;
            border: 2px solid #f56565;
        }
        .result-icon {
            font-size: 32px;
            margin-bottom: 12px;
            text-align: center;
        }
        .result-title {
            font-weight: 600;
            margin-bottom: 8px;
            text-align: center;
            color: #2d3748;
        }
        .result-message {
            color: #4a5568;
            font-size: 14px;
            text-align: center;
            line-height: 1.6;
        }
        .btn-download {
            display: block;
            width: 100%;
            margin-top: 16px;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease;
        }
        .btn-download:hover {
            transform: translateY(-2px);
        }
        .btn-reset {
            display: block;
            width: 100%;
            margin-top: 12px;
            padding: 10px;
            background: transparent;
            color: #667eea;
            border: 2px solid #667eea;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .btn-reset:hover {
            background: #667eea;
            color: white;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>PND Navigator Patcher</h1>
        <p class="subtitle">Patch automatico per navigatori GPS Renault</p>
        
        <div class="drop-zone" id="dropZone">
            <div class="drop-zone-icon">📦</div>
            <div class="drop-zone-text">Trascina qui il file ZIP</div>
            <div class="drop-zone-hint">oppure clicca per selezionare</div>
        </div>
        <input type="file" id="fileInput" accept=".zip">
        
        <div class="progress" id="progress">
            <div class="progress-bar">
                <div class="progress-bar-fill" id="progressFill"></div>
            </div>
            <div class="progress-text" id="progressText">Elaborazione in corso...</div>
        </div>
        
        <div class="result" id="result">
            <div class="result-icon" id="resultIcon"></div>
            <div class="result-title" id="resultTitle"></div>
            <div class="result-message" id="resultMessage"></div>
            <button class="btn-download" id="btnDownload" style="display:none;">Scarica ZIP Modificato</button>
            <button class="btn-reset" id="btnReset">Elabora un altro file</button>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script>
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const progress = document.getElementById('progress');
        const progressFill = document.getElementById('progressFill');
        const progressText = document.getElementById('progressText');
        const result = document.getElementById('result');
        const resultIcon = document.getElementById('resultIcon');
        const resultTitle = document.getElementById('resultTitle');
        const resultMessage = document.getElementById('resultMessage');
        const btnDownload = document.getElementById('btnDownload');
        const btnReset = document.getElementById('btnReset');

        let patchedBlob = null;

        dropZone.addEventListener('click', () => fileInput.click());

        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('dragover');
        });

        dropZone.addEventListener('dragleave', () => {
            dropZone.classList.remove('dragover');
        });

        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                handleFile(files[0]);
            }
        });

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                handleFile(e.target.files[0]);
            }
        });

        btnReset.addEventListener('click', () => {
            dropZone.style.display = 'block';
            progress.style.display = 'none';
            result.style.display = 'none';
            fileInput.value = '';
            patchedBlob = null;
        });

        btnDownload.addEventListener('click', () => {
            if (patchedBlob) {
                const a = document.createElement('a');
                a.href = URL.createObjectURL(patchedBlob);
                a.download = 'PNDNavigator_patched.zip';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
            }
        });

        async function searchPNDNavigator(zipContent, basePath = '') {
            for (const [filename, zipEntry] of Object.entries(zipContent.files)) {
                const fullPath = basePath + filename;
                
                if (!zipEntry.dir) {
                    const nameLower = filename.toLowerCase();
                    const basenameLower = filename.split('/').pop().toLowerCase();
                    
                    if (basenameLower.includes('pndnavigator') && !nameLower.endsWith('.zip')) {
                        return { file: zipEntry, path: fullPath };
                    }
                    
                    if (nameLower.endsWith('.zip')) {
                        try {
                            const nestedZipData = await zipEntry.async('uint8array');
                            const nestedZip = await JSZip.loadAsync(nestedZipData);
                            const result = await searchPNDNavigator(nestedZip, fullPath + ' > ');
                            if (result) return result;
                        } catch (e) {
                            // Skip invalid nested ZIPs
                        }
                    }
                }
            }
            return null;
        }

        async function handleFile(file) {
            if (!file.name.toLowerCase().endsWith('.zip')) {
                showError('Errore: Il file deve essere un archivio ZIP');
                return;
            }

            dropZone.style.display = 'none';
            progress.style.display = 'block';
            result.style.display = 'none';

            try {
                setProgress(10, 'Lettura archivio ZIP...');
                const zip = new JSZip();
                const zipContent = await zip.loadAsync(file);

                setProgress(30, 'Ricerca file PNDNavigator (anche in ZIP annidati)...');
                
                const searchResult = await searchPNDNavigator(zipContent);

                if (!searchResult) {
                    throw new Error('File PNDNavigator non trovato nell\'archivio ZIP (controllato anche in sottocartelle e ZIP annidati)');
                }
                
                const pndFile = searchResult.file;
                const pndFileName = searchResult.path;

                setProgress(50, 'Estrazione file PNDNavigator...');
                const fileData = await pndFile.async('uint8array');

                setProgress(70, 'Applicazione patch...');
                // L'indirizzo virtuale 0x00402928 corrisponde a offset file = indirizzo - base PE (0x400000)
                const targetOffset = 0x00402928 - 0x400000; // = 0x2928
                
                if (targetOffset >= fileData.length) {
                    throw new Error(`Offset 0x${targetOffset.toString(16)} fuori dai limiti del file`);
                }

                const originalByte = fileData[targetOffset];
                
                if (originalByte === 0xD6) {
                    fileData[targetOffset] = 0xB9;
                    
                    setProgress(85, 'Ricostruzione archivio ZIP...');
                    const newZip = new JSZip();
                    
                    for (const [filename, zipEntry] of Object.entries(zipContent.files)) {
                        if (filename === pndFileName) {
                            newZip.file(filename, fileData);
                        } else if (!zipEntry.dir) {
                            const content = await zipEntry.async('uint8array');
                            newZip.file(filename, content);
                        }
                    }
                    
                    setProgress(95, 'Generazione file finale...');
                    patchedBlob = await newZip.generateAsync({
                        type: 'blob',
                        compression: 'DEFLATE',
                        compressionOptions: { level: 6 }
                    });
                    
                    setProgress(100, 'Completato!');
                    
                    setTimeout(() => {
                        showSuccess(
                            'Patch applicata con successo',
                            `File: ${pndFileName}<br>` +
                            `Offset: 0x${targetOffset.toString(16).toUpperCase()}<br>` +
                            `Byte modificato: 0xD6 → 0xB9`
                        );
                    }, 300);
                    
                } else {
                    throw new Error(
                        `Byte all'offset 0x${targetOffset.toString(16)} è 0x${originalByte.toString(16).toUpperCase()}, non 0xD6. ` +
                        `Il file potrebbe essere già stato modificato.`
                    );
                }

            } catch (error) {
                showError('Errore: ' + error.message);
            }
        }

        function setProgress(percent, text) {
            progressFill.style.width = percent + '%';
            progressText.textContent = text;
        }

        function showSuccess(title, message) {
            progress.style.display = 'none';
            result.className = 'result success';
            result.style.display = 'block';
            resultIcon.textContent = '✅';
            resultTitle.textContent = title;
            resultMessage.innerHTML = message;
            btnDownload.style.display = 'block';
        }

        function showError(message) {
            progress.style.display = 'none';
            result.className = 'result error';
            result.style.display = 'block';
            resultIcon.textContent = '❌';
            resultTitle.textContent = 'Errore';
            resultMessage.textContent = message;
            btnDownload.style.display = 'none';
        }
    </script>
</body>
</html>
